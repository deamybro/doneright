services:
  - type: web
    name: doneright
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/ui/main.py --server.port $PORT --server.address 0.0.0.0 --server.fileWatcherType none
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
